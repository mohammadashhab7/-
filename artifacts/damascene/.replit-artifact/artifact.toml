kind = "web"
previewPath = "/"
title = "الدمشقي"
version = "1.0.0"
id = "artifacts/damascene"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21290

[services.development]
run = "pnpm --filter @workspace/damascene run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/damascene", "run", "build" ]
publicDir = "artifacts/damascene/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21290"
BASE_PATH = "/"
